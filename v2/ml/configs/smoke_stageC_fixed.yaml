name: smoke_stageC_fixed
out_dir: ml/runs/smoke/20260928_195807/stageC_fixed
data:
  data_dir: data/synthetic
  manifest: data/synthetic/manifest.csv
  h_ref: 25.0
  points_per_epoch: 4096
  collocation_per_epoch: 1024
  wall_points_per_epoch: 512
  seed: 0
features:
  num_fourier_bands: 8
  fourier_sigma: 4.0
  variant_embedding_dim: 4
model:
  kind: mlp
  hidden_layers: [64, 64, 64]
  activation: tanh
physics:
  stage: C
  nu: 1.5e-5
  pressure_includes_two_thirds_k: false
loss_weights:
  mode: fixed
  w_data: 1.0
  w_continuity: 0.1
  w_momentum: 0.001
  w_wall_bc: 1.0
train:
  epochs: 40
  steps_per_epoch: 12
  optimizer: adam+lbfgs
  lr: 1.0e-3
  lbfgs_steps: 20
  lbfgs_lr: 1.0
  device: cuda
  amp: false
  grad_clip: 1.0
  log_every: 5
compare_checkpoints:
  stage_a: ml/runs/smoke/20260928_195807/stageA/checkpoint.pt
  deeponet: ml/runs/smoke/20260928_195807/deeponet/checkpoint.pt
warm_start_checkpoint: ml/runs/smoke/20260928_195807/stageB/checkpoint.pt
